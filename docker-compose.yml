services:
  db:
    image: postgres:16-alpine
    container_name: cc-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: commit_conquer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: cc-cache
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cc-app
    ports:
      - "4000:4000"
      - "5173:5173"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/commit_conquer
      - REDIS_URL=redis://cache:6379
      - NODE_ENV=development
    depends_on:
      - db
      - cache
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
